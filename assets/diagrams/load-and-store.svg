<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img"><rect width="1060" height="410" fill="#f9fbfc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#008eae"/></marker></defs><rect x="48" y="135" width="296" height="158" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="196.0" y="214.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">Memory</text><text x="196.0" y="248.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">cells[0] = 10</text><rect x="715" y="135" width="296" height="158" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="863.0" y="214.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">CPU registers</text><text x="863.0" y="248.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">a = 10, sum = 30</text><path d="M353 185 L695 185" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><path d="M695 251 L353 251" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><text x="530" y="161" fill="#008eae" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">LOAD: 10 travels in</text><text x="530" y="302" fill="#d88335" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">STORE: 30 travels out</text><text x="530" y="365" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="22" text-anchor="middle">The cache can supply or accept either access</text></svg>