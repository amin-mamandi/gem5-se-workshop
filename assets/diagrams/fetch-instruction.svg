<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img"><rect width="1060" height="410" fill="#f9fbfc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#008eae"/></marker></defs><rect x="40" y="152" width="260" height="117" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="170.0" y="210.5" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">Program counter</text><text x="170.0" y="244.5" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">next instruction address</text><rect x="401" y="152" width="252" height="117" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="527.0" y="210.5" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">Instruction bytes</text><text x="527.0" y="244.5" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">fetched from memory</text><rect x="755" y="152" width="270" height="117" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="890.0" y="210.5" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">Control</text><text x="890.0" y="244.5" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">decodes instruction</text><path d="M307 210 L382 210" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><path d="M661 210 L736 210" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><text x="346" y="183" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">address</text><text x="701" y="183" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">bits</text><text x="530" y="355" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="23" text-anchor="middle">After a jump, the program counter holds the target address</text></svg>