<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img"><rect width="1060" height="410" fill="#f9fbfc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#008eae"/></marker></defs><rect x="65" y="56" width="930" height="294" rx="22" fill="#f0f8fa" stroke="#008eae" stroke-width="4"/><text x="530" y="105" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="38" text-anchor="middle">CPU</text><rect x="126" y="145" width="236" height="133" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="244.0" y="211.5" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">Control</text><text x="244.0" y="245.5" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">chooses actions</text><rect x="412" y="145" width="236" height="133" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="530.0" y="211.5" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">Registers</text><text x="530.0" y="245.5" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">hold current values</text><rect x="698" y="145" width="236" height="133" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="816.0" y="211.5" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">Arithmetic</text><text x="816.0" y="245.5" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">does the addition</text><text x="530" y="325" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="23" text-anchor="middle">These are parts of one CPU core, not steps in a pipeline</text></svg>