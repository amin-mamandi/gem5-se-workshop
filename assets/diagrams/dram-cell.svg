<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img"><rect width="1060" height="410" fill="#f9fbfc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#008eae"/></marker></defs><text x="530" y="75" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="30" text-anchor="middle">One DRAM bit: a switch and a tiny charge store</text><rect x="97" y="134" width="246" height="138" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="220.0" y="203.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">Transistor</text><text x="220.0" y="237.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">select switch</text><path d="M354 203 L470 203" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><path d="M488 136 L488 270 M527 136 L527 270" stroke="#008eae" stroke-width="8"/><text x="508" y="320" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">Capacitor</text><text x="794" y="202" fill="#008eae" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">charge = bit</text><text x="530" y="375" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="23" text-anchor="middle">Refresh restores charge as it leaks away</text></svg>