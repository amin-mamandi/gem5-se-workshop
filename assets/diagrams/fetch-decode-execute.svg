<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img"><rect width="1060" height="410" fill="#f9fbfc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#008eae"/></marker></defs><rect x="50" y="80" width="270" height="140" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="185.0" y="150.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">Fetch</text><text x="185.0" y="184.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">get the next instruction</text><rect x="395" y="80" width="270" height="140" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="530.0" y="150.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">Decode</text><text x="530.0" y="184.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">work out what it means</text><rect x="740" y="80" width="270" height="140" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="875.0" y="150.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">Execute</text><text x="875.0" y="184.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">do it</text><path d="M328 150 L380 150" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><path d="M673 150 L725 150" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><path d="M875 228 V300 H185 V246" fill="none" stroke="#008eae" stroke-width="5" marker-end="url(#arrow)"/><text x="530" y="288" fill="#008eae" font-family="Arial,sans-serif" font-weight="bold" font-size="28" text-anchor="middle">repeat</text><text x="530" y="370" fill="#526b79" font-family="Arial,sans-seri