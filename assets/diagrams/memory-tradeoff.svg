<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img"><rect width="1060" height="410" fill="#f9fbfc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#008eae"/></marker></defs><rect x="78" y="115" width="210" height="150" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="183.0" y="190.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">Registers</text><text x="183.0" y="224.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">tiny, closest</text><rect x="389" y="115" width="265" height="150" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="521.5" y="190.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">Caches</text><text x="521.5" y="224.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">small, fast</text><rect x="751" y="115" width="230" height="150" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="866.0" y="190.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">DRAM</text><text x="866.0" y="224.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">larger, farther</text><text x="530" y="354" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="25" text-anchor="middle">Left to right: more capacity, usually longer to reach</text></svg>