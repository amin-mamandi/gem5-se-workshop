<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img"><rect width="1060" height="410" fill="#f9fbfc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#008eae"/></marker></defs><rect x="64" y="95" width="435" height="207" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="281.5" y="198.5" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">SRAM</text><text x="281.5" y="232.5" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">6 transistors per typical cell</text><rect x="561" y="95" width="435" height="207" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="778.5" y="198.5" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">DRAM</text><text x="778.5" y="232.5" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">1 transistor + 1 capacitor</text><text x="280" y="352" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="23" text-anchor="middle">fast · low density · costly per bit</text><text x="778" y="352" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="23" text-anchor="middle">dense · slower · cheaper per bit</text></svg>