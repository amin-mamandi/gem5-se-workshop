<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img"><rect width="1060" height="410" fill="#f9fbfc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#008eae"/></marker></defs><rect x="45" y="128" width="284" height="160" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="187.0" y="208.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">ACT</text><text x="187.0" y="242.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">open row 4 in bank 0</text><rect x="388" y="128" width="284" height="160" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="530.0" y="208.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="24" text-anchor="middle">READ / CAS</text><text x="530.0" y="242.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">select column in row 4</text><rect x="731" y="128" width="284" height="160" rx="16" fill="#e4f3f7" stroke="#008eae" stroke-width="3"/><text x="873.0" y="208.0" fill="#153347" font-family="Arial,sans-serif" font-weight="bold" font-size="31" text-anchor="middle">PRE</text><text x="873.0" y="242.0" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="20" text-anchor="middle">close row 4</text><path d="M337 207 L371 207" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><path d="M680 207 L714 207" fill="none" stroke="#008eae" stroke-width="5"  marker-end="url(#arrow)"/><text x="530" y="365" fill="#526b79" font-family="Arial,sans-serif" font-weight="normal" font-size="23" text-anchor="middle">The row can stay open for more than one READ</text></svg>